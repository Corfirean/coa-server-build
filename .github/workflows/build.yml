name: build
# Build a frozen candidate and publish complete immutable assets; promotion has separate gates.
on:
  workflow_call:
    inputs:
      binaries_run_id:
        type: string
        default: ""
      binary_core_ref:
        type: string
        default: ""
      release_version:
        type: string
        description: Optional release version (0.yyMMdd.build); must be newer than stable
        default: ''
      core_ref:
        type: string
        description: Fork ref (branch, tag or SHA)
        default: coa-bots
      upstream_ref:
        type: string
        description: Upstream revision integrated and tested in the selected core
        default: main
      bots_ref:
        type: string
        description: mod-coa-playerbots ref (branch, tag or SHA)
        default: master
      scaling_ref:
        type: string
        description: mod-coa-content-scaling ref (branch, tag or SHA)
        default: main
      squid_ref:
        type: string
        description: 'SQUID source: latest-release selects the newest stable v* tag; explicit refs override'
        default: latest-release
      manager_ref:
        type: string
        description: Manager release-tool ref (must support release schema validation)
        default: master
    secrets:
      COA_SIGNING_KEY:
        required: false
  workflow_dispatch:
    inputs:
      binaries_run_id:
        description: Completed run with successful source and binary jobs (SQL-only repackaging)
        default: ""
      binary_core_ref:
        description: Exact core SHA used to compile those binaries
        default: ""
      release_version:
        description: Optional release version (0.yyMMdd.build); must be newer than stable
        default: ''
      core_ref:
        description: Fork ref (branch, tag or SHA)
        default: coa-bots
      upstream_ref:
        description: Upstream revision integrated and tested in the selected core
        default: main
      bots_ref:
        description: mod-coa-playerbots ref (branch, tag or SHA)
        default: master
      scaling_ref:
        description: mod-coa-content-scaling ref (branch, tag or SHA)
        default: main
      squid_ref:
        description: 'SQUID source: latest-release selects the newest stable v* tag; explicit refs override'
        default: latest-release
      manager_ref:
        description: Manager release-tool ref (must support release schema validation)
        default: master

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_REF: ${{ inputs.core_ref || 'coa-bots' }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
      BOTS_REF: ${{ inputs.bots_ref || 'master' }}
      SCALING_REF: ${{ inputs.scaling_ref || 'main' }}
      SQUID_REF: ${{ inputs.squid_ref || 'latest-release' }}
      MANAGER_REF: ${{ inputs.manager_ref || 'master' }}
    outputs:
      core: ${{ steps.lock.outputs.core }}
      bots: ${{ steps.lock.outputs.bots }}
      scaling: ${{ steps.lock.outputs.scaling }}
      squid: ${{ steps.lock.outputs.squid }}
      manager: ${{ steps.lock.outputs.manager }}
    steps:
      - uses: actions/checkout@v7
      - name: Load shared daily snapshot
        if: github.workflow == 'daily-release'
        uses: actions/download-artifact@v4
        with:
          name: release-lock
          path: _release-lock
      - name: Freeze all sources before compilation
        id: lock
        run: python3 scripts/candidate-lock.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-lock-windows
          path: _release-lock/release-lock.json
          if-no-files-found: error
  binaries:
    needs: resolve
    if: inputs.binaries_run_id == ''
    uses: ./.github/workflows/server-binaries.yml
    with:
      core_ref: ${{ needs.resolve.outputs.core }}
      bots_ref: ${{ needs.resolve.outputs.bots }}
      scaling_ref: ${{ needs.resolve.outputs.scaling }}
      squid_ref: ${{ needs.resolve.outputs.squid }}

  reuse:
    needs: resolve
    if: inputs.binaries_run_id != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.binaries_run_id }}
      OLD_CORE: ${{ inputs.binary_core_ref }}
      NEW_CORE: ${{ needs.resolve.outputs.core }}
      BOTS: ${{ needs.resolve.outputs.bots }}
      SCALING: ${{ needs.resolve.outputs.scaling }}
      SQUID: ${{ needs.resolve.outputs.squid }}
    outputs:
      core_sha: ${{ steps.pins.outputs.core_sha }}
      bots_sha: ${{ steps.pins.outputs.bots_sha }}
      scaling_sha: ${{ steps.pins.outputs.scaling_sha }}
      squid_sha: ${{ steps.pins.outputs.squid_sha }}
      squid_tag: ${{ inputs.squid_ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate verified binaries and SQL-only source delta
        id: pins
        run: python3 scripts/validate-binary-reuse.py
  package:
    if: always() && (needs.binaries.result == 'success' || needs.reuse.result == 'success')
    needs: [resolve, binaries, reuse]
    runs-on: windows-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      SQUID_SHA: ${{ needs.binaries.outputs.squid_sha || needs.reuse.outputs.squid_sha }}
      SQUID_TAG: ${{ needs.binaries.outputs.squid_tag || needs.reuse.outputs.squid_tag }}
      CORE_SHA: ${{ needs.binaries.outputs.core_sha || needs.reuse.outputs.core_sha }}
      BOTS_SHA: ${{ needs.binaries.outputs.bots_sha || needs.reuse.outputs.bots_sha }}
      SCALING_SHA: ${{ needs.binaries.outputs.scaling_sha || needs.reuse.outputs.scaling_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Load frozen source lock
        uses: actions/download-artifact@v4
        with:
          name: release-lock-windows
          path: _release-lock
      - name: Manager tools (coa-release)
        uses: actions/checkout@v7
        with:
          repository: Corfirean/coa-server-manager
          ref: ${{ needs.resolve.outputs.manager }}
          path: _manager
      - name: Cache release-tool dependencies
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _manager/target
          key: trusted-release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('_manager/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: trusted-release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('_manager/Cargo.lock') }}-
      - name: Build coa-release
        shell: pwsh
        run: cargo build --release -p coa-release --manifest-path _manager/Cargo.toml
      - name: Core sources at the exact commit (full history, SQL order comes from it)
        uses: actions/checkout@v7
        with:
          repository: Corfirean/azerothcore-wotlk-coa
          ref: ${{ env.CORE_SHA }}
          path: _core
          fetch-depth: 0
      - name: Bots module at the exact commit
        uses: actions/checkout@v7
        with:
          repository: Corfirean/mod-coa-playerbots
          ref: ${{ env.BOTS_SHA }}
          path: _bots
      - name: Content Scaling module at the exact commit
        uses: actions/checkout@v7
        with:
          repository: Corfirean/mod-coa-content-scaling
          ref: ${{ env.SCALING_SHA }}
          path: _scaling
      - name: SQUID Playerbots at the exact unmodified commit
        uses: actions/checkout@v7
        with:
          repository: Zyth45/mod-playerbots
          ref: ${{ env.SQUID_SHA }}
          path: _core/modules/mod-playerbots
      - name: Place Content Scaling and its content packs into the core tree (their SQL and configs ship with the release)
        shell: pwsh
        run: |
          robocopy '_scaling' '_core\modules\mod-coa-content-scaling' /E /XD .git artifacts tools /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "copying mod-coa-content-scaling failed ($LASTEXITCODE)" }
          foreach ($pack in 'mod-coa-tbc-content', 'mod-coa-wotlk-content') {
            robocopy "_scaling\content-packs\$pack" "_core\modules\$pack" /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "copying $pack failed ($LASTEXITCODE)" }
          }
          $global:LASTEXITCODE = 0
      - name: Download the compiled binaries
        uses: actions/download-artifact@v4
        with:
          name: coa-server-binaries
          path: _binaries
          run-id: ${{ inputs.binaries_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Restore SQUID release identity from the source lock
        shell: pwsh
        run: |
          $lock = Get-Content _release-lock/release-lock.json -Raw | ConvertFrom-Json
          "SQUID_TAG=$($lock.components.squid.ref)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Assemble the release tree
        shell: pwsh
        run: ./scripts/assemble-tree.ps1 -Binaries _binaries -Core _core -Bots _bots -Out _tree -Manager _manager -CoreSha $env:CORE_SHA -BotsSha $env:BOTS_SHA -ScalingSha $env:SCALING_SHA -SquidSha $env:SQUID_SHA -SquidTag $env:SQUID_TAG
      - name: Restore frozen navigation data
        shell: pwsh
        run: python scripts/restore-navigation.py --lock _release-lock/release-lock.json --tree _tree --download _navigation-download
      - name: Record source and reused binary provenance
        if: inputs.binaries_run_id != ''
        shell: pwsh
        env:
          BINARY_CORE_SHA: ${{ inputs.binary_core_ref }}
          BINARY_RUN_ID: ${{ inputs.binaries_run_id }}
        run: |
          @{ schema = 1; sourceCore = $env:CORE_SHA; binaryCore = $env:BINARY_CORE_SHA; binaryRun = $env:BINARY_RUN_ID; changes = 'sql-only' } | ConvertTo-Json | Set-Content _tree/Scripts/binary-provenance.json -Encoding utf8NoBOM
      - name: Fetch the signed base package for database acceptance
        shell: pwsh
        run: |
          python scripts/upgrade-sources.py --lock _release-lock/release-lock.json --download _upgrade-sources --packages --role base --tool _manager/target/release/coa-release.exe
          if ($LASTEXITCODE) { throw "Full locked upgrade fixture verification failed." }
          New-Item -ItemType Directory -Force _schema-base | Out-Null
          Copy-Item _upgrade-sources/base/* _schema-base
          Copy-Item _schema-base/manifest.json base-manifest.json
      - name: Apply release SQL on an isolated database and capture the expected schema
        shell: pwsh
        run: |
          $tool = "_manager/target/release/coa-release.exe"
          & $tool extract-schema-base --package _schema-base --fixture coa-schema-fixture-build
          if ($LASTEXITCODE) { throw "Preparing the isolated database failed." }
          $env:COA_MYSQL_TEST_BIN = (Resolve-Path coa-schema-fixture-build/mysql/bin).Path
          $testName = "real_mysql_restores_objects_users_rows_and_missing_defaults"
          $testList = & cargo test -p coa-core --manifest-path _manager/Cargo.toml $testName -- --ignored --list | Out-String
          if ($LASTEXITCODE -or $testList -notmatch $testName) { throw "The pinned Manager does not provide the required database recovery test." }
          & cargo test -p coa-core --manifest-path _manager/Cargo.toml $testName -- --ignored --test-threads=1
          if ($LASTEXITCODE) { throw "Recovery of database objects or legacy defaults failed; this release will not be published." }
          & coa-schema-fixture-build/Runtime/python/python.exe -I -c "import runpy,sys;runpy.run_path(sys.argv[1]);import squid_playerbots" _tree/Scripts/manage.py
          if ($LASTEXITCODE) { throw "The release launcher cannot load its helper with the bundled Python runtime." }
          & $tool schema-contract --repack coa-schema-fixture-build --tree _tree --core _core --bots _bots --repairs database-repairs
          if ($LASTEXITCODE) { throw "Database acceptance failed; this release will not be published." }
          if (-not (Test-Path _tree/Scripts/database-schema.json)) { throw "The database schema contract was not produced." }
      - name: Start auth and world from the candidate in a disposable isolated server
        shell: pwsh
        run: |
          $fixture = (Resolve-Path coa-schema-fixture-build).Path
          $priorLogs = Join-Path $fixture 'Core/Logs'
          if (Test-Path -LiteralPath $priorLogs) {
            Move-Item -LiteralPath $priorLogs -Destination (Join-Path $fixture 'Core/qualification-prior-logs')
          }
          New-Item -ItemType Directory -Path $priorLogs -Force | Out-Null
          & _tree/Core/worldserver.exe --version
          if ($LASTEXITCODE) { throw "Candidate worldserver cannot execute: $LASTEXITCODE" }
          & _tree/Core/authserver.exe --version
          if ($LASTEXITCODE) { throw "Candidate authserver cannot execute: $LASTEXITCODE" }
          & _manager/target/release/coa-release.exe qualify-startup --fixture coa-schema-fixture-build --tree _tree --base _schema-base
          if ($LASTEXITCODE) { throw "Full isolated server startup failed; the candidate will not be published." }
      - name: Preserve server acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-acceptance-failure
          path: |
            coa-schema-fixture-build/Core/Logs
            coa-schema-fixture-build.manager/updates
            coa-schema-fixture-build.manager/diagnostics
            coa-schema-fixture-build.manager/validation-configs.json
          if-no-files-found: ignore
      - name: Pack, sign, verify
        shell: pwsh
        env:
          COA_SIGNING_KEY: ${{ secrets.COA_SIGNING_KEY }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if (-not $env:COA_SIGNING_KEY) { throw "Add the COA_SIGNING_KEY secret (see README) - unsigned packages are never published." }
          $version = $env:RELEASE_VERSION
          if (-not $version) { $version = "0.$((Get-Date).ToString('yyMMdd')).${{ github.run_number }}" }
          if ($version -notmatch '^0\.[0-9]{6}\.[0-9]+$') { throw "Invalid release version: $version" }
          $stableVersion = (Get-Content _upgrade-sources/stable-1/manifest.json -Raw | ConvertFrom-Json).version
          if ([version]$version -le [version]$stableVersion) { throw "Release $version must be newer than stable $stableVersion." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $tool = "_manager/target/release/coa-release.exe"
          & $tool pack-update --tree _tree --base-manifest base-manifest.json --core _core --bots _bots --out _out `
            --version $version --core-commit $env:CORE_SHA --bots-commit $env:BOTS_SHA --repairs database-repairs
          if ($LASTEXITCODE) { throw "pack-update failed" }
          $manifestPath = '_out/manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.minManagerVersion = '0.6.15'
          $manifest | ConvertTo-Json -Depth 100 | Set-Content $manifestPath -Encoding utf8NoBOM
          python scripts/release-compatibility.py --dir _out --lock _release-lock/release-lock.json --sources _upgrade-sources --schema-base _schema-base --platform windows-x86_64 --tool $tool
          if ($LASTEXITCODE) { throw "Release compatibility validation failed" }
          & $tool sign --dir _out;   if ($LASTEXITCODE) { throw "sign failed" }
          & $tool verify --dir _out; if ($LASTEXITCODE) { throw "verify failed" }
      - name: Build and qualify full clean installation
        shell: pwsh
        env:
          COA_SIGNING_KEY: ${{ secrets.COA_SIGNING_KEY }}
        run: |
          $tool = "_manager/target/release/coa-release.exe"
          & $tool compose-install --base _schema-base --candidate _out --fixture coa-schema-fixture-install-image
          if ($LASTEXITCODE) { throw "Preparing the full installation image failed." }
          & $tool pack-base --tree coa-schema-fixture-install-image --out _install-out --version $env:VERSION --core-commit $env:CORE_SHA --bots-commit $env:BOTS_SHA
          if ($LASTEXITCODE) { throw "Packing the full installation image failed." }
          python scripts/installer-package.py prepare --installer _install-out --candidate _out
          if ($LASTEXITCODE) { throw "Installation package identity validation failed." }
          & $tool sign --dir _install-out
          if ($LASTEXITCODE) { throw "Signing the installation image failed." }
          $workspace = [IO.Path]::GetFullPath((Get-Location).Path).TrimEnd('\') + '\'
          foreach ($owned in 'coa-schema-fixture-install-image', 'coa-schema-fixture-install-image.manager') {
            $absolute = [IO.Path]::GetFullPath((Join-Path (Get-Location) $owned))
            if (-not $absolute.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw 'Fixture cleanup escaped the workspace.' }
            Remove-Item -LiteralPath $absolute -Recurse -Force
          }
          & $tool qualify-install --package _install-out --fixture coa-schema-fixture-clean-install --report _install-qualification.json
          if ($LASTEXITCODE) { throw "The full package failed clean installation qualification." }
          python scripts/installer-package.py embed --installer _install-out --candidate _out --report _install-qualification.json
          if ($LASTEXITCODE) { throw "Binding the qualified installer to the release failed." }
          & $tool sign --dir _out
          if ($LASTEXITCODE) { throw "Signing the candidate with installation assets failed." }
          & $tool verify-install --dir _out
          if ($LASTEXITCODE) { throw "The embedded installation package failed verification." }
          foreach ($owned in 'coa-schema-fixture-clean-install', 'coa-schema-fixture-clean-install.manager') {
            $absolute = [IO.Path]::GetFullPath((Join-Path (Get-Location) $owned))
            if (-not $absolute.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw 'Fixture cleanup escaped the workspace.' }
            Remove-Item -LiteralPath $absolute -Recurse -Force
          }
      - name: Qualify Manager upgrades from every published release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _upgrade-reports | Out-Null
          $sources = (Get-Content _release-lock/release-lock.json -Raw | ConvertFrom-Json).upgradeSources
          foreach ($source in $sources) {
            $role = $source.role
            python scripts/upgrade-sources.py --lock _release-lock/release-lock.json --download _upgrade-sources --packages --role $role --tool _manager/target/release/coa-release.exe
            if ($LASTEXITCODE) { throw "Signed upgrade source $role could not be verified." }
            $fixture = "coa-schema-fixture-upgrade-$role"
            & _manager/target/release/coa-release.exe qualify-upgrade --base _schema-base --source "_upgrade-sources/$role" --candidate _out --fixture $fixture --report "_upgrade-reports/$role.json"
            if ($LASTEXITCODE) { throw "Manager upgrade from $role failed; candidate publication is blocked." }
            $workspace = [IO.Path]::GetFullPath((Get-Location).Path).TrimEnd('\') + '\'
            foreach ($owned in $fixture, "$fixture.manager") {
              $absolute = [IO.Path]::GetFullPath((Join-Path (Get-Location) $owned))
              if (-not $absolute.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw 'Fixture cleanup escaped the workspace.' }
              Remove-Item -LiteralPath $absolute -Recurse -Force
            }
            # Only one old archive is needed at a time; retain every signed manifest and report.
            if ($role -ne 'base') {
              $package = Join-Path _upgrade-sources $role
              $sourceManifest = Get-Content (Join-Path $package manifest.json) -Raw | ConvertFrom-Json
              foreach ($part in $sourceManifest.archive.parts) {
                if ($part.name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') { throw 'Invalid archive name during fixture cleanup.' }
                Remove-Item -LiteralPath (Join-Path $package $part.name) -Force
              }
            }
          }
      - name: Preserve Manager upgrade qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-manager-upgrade-qualification
          path: |
            _upgrade-reports
            _install-qualification.json
            coa-schema-fixture-clean-install/Core/Logs
            coa-schema-fixture-clean-install.manager/diagnostics
            coa-schema-fixture-install-image/Core/Logs
            coa-schema-fixture-install-image.manager/diagnostics
            coa-schema-fixture-upgrade-*/Core/Logs
            coa-schema-fixture-upgrade-*.manager/diagnostics
            coa-schema-fixture-upgrade-*.manager/updates/*/txn.json
            coa-schema-fixture-upgrade-*.manager/validation-configs.json
          if-no-files-found: ignore
      - name: Bind qualification and release metadata to the signed candidate
        shell: pwsh
        env:
          COA_SIGNING_KEY: ${{ secrets.COA_SIGNING_KEY }}
          BINARY_RUN: ${{ inputs.binaries_run_id }}
          BINARY_CORE_SHA: ${{ inputs.binary_core_ref }}
        run: |
          python scripts/release-metadata.py --dir _out --lock _release-lock/release-lock.json --platform windows-x86_64 --binary-run "$env:BINARY_RUN"
          if ($LASTEXITCODE) { throw 'Release evidence is missing or differs from the candidate.' }
          & _manager/target/release/coa-release.exe sign --dir _out
          if ($LASTEXITCODE) { throw 'Signing final metadata failed.' }
      - name: Publish immutable Windows candidate
        shell: pwsh
        run: |
          python scripts/publish-candidate.py --dir _out --repo $env:GITHUB_REPOSITORY --tool _manager/target/release/coa-release.exe
