name: daily-release
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      core: ${{ steps.snapshot.outputs.core }}
      bots: ${{ steps.snapshot.outputs.bots }}
      scaling: ${{ steps.snapshot.outputs.scaling }}
      squid: ${{ steps.snapshot.outputs.squid }}
      manager: ${{ steps.snapshot.outputs.manager }}
      version: ${{ steps.snapshot.outputs.version }}
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip when a release is already running
        id: active
        run: |
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --limit 100 --json databaseId,workflowName --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.workflowName == \"daily-release\" or .workflowName == \"build\" or .workflowName == \"build-linux\"))] | length")
          if [ "$count" -gt 0 ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Skipped: another release is still running.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$count" -eq 0 ]; then
            python3 scripts/daily-lease.py
          fi
      - name: Integration checkout
        if: steps.active.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: Corfirean/azerothcore-wotlk-coa
          ref: coa-bots
          fetch-depth: 0
          path: _integration
          token: ${{ secrets.FORK_PUSH_TOKEN }}
      - name: Integrate upstream and race release
        if: steps.active.outputs.skip != 'true'
        id: integration
        run: python3 scripts/integrate-candidate.py
      - name: Checkout Manager used by the snapshot verifier
        if: steps.active.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: Corfirean/coa-server-manager
          ref: master
          path: _manager
      - name: Cache daily channel verifier dependencies
        if: steps.active.outputs.skip != 'true'
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: trusted-daily-cargo-${{ runner.os }}-${{ hashFiles('_manager/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            trusted-daily-cargo-${{ runner.os }}-${{ hashFiles('_manager/Cargo.lock') }}-
      - name: Resolve and check daily snapshot
        if: steps.active.outputs.skip != 'true'
        id: snapshot
        run: |
          python3 scripts/daily-release.py --check-integration --core-ref '${{ steps.integration.outputs.core }}' --manager-ref "$(git -C _manager rev-parse HEAD)"
          python3 scripts/upgrade-sources.py --lock release-lock.json
          python3 scripts/daily-decision.py --manager _manager
      - uses: actions/upload-artifact@v4
        if: always() && steps.active.outputs.skip != 'true'
        with:
          name: release-lock
          path: release-lock.json
          if-no-files-found: error
      - name: Report blocked integration
        if: failure()
        run: |
          title='Daily release blocked'
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          printf 'Daily snapshot could not pass integration checks. Previous stable is unchanged.\n\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/daily-failure.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/daily-failure.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/daily-failure.md
          fi
  windows:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      core_ref: ${{ needs.resolve.outputs.core }}
      bots_ref: ${{ needs.resolve.outputs.bots }}
      scaling_ref: ${{ needs.resolve.outputs.scaling }}
      squid_ref: ${{ needs.resolve.outputs.squid }}
      manager_ref: ${{ needs.resolve.outputs.manager }}
      release_version: ${{ needs.resolve.outputs.version }}
  linux:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      core_ref: ${{ needs.resolve.outputs.core }}
      bots_ref: ${{ needs.resolve.outputs.bots }}
      scaling_ref: ${{ needs.resolve.outputs.scaling }}
      squid_ref: ${{ needs.resolve.outputs.squid }}
      manager_ref: ${{ needs.resolve.outputs.manager }}
      release_version: ${{ needs.resolve.outputs.version }}
  report-failure:
    needs: [resolve, windows, linux]
    if: always() && (needs.resolve.result == 'failure' || needs.windows.result == 'failure' || needs.linux.result == 'failure' || needs.windows.result == 'cancelled' || needs.linux.result == 'cancelled')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Update the candidate failure diagnostic
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          results = json.loads(os.environ['RESULTS'])
          title = 'Daily release blocked'
          issues = json.loads(subprocess.check_output(['gh','issue','list','--repo',repo,'--state','open','--search',title+' in:title','--json','number,title'], text=True))
          issue = next((i for i in issues if i['title'] == title), None)
          body = pathlib.Path('/tmp/daily-candidate-failure.md')
          status = '\n'.join('- '+name+': '+job['result'] for name,job in results.items())
          body.write_text('The daily candidate failed. Previous stable remains unchanged.\n\n'+status+'\n\nRun: https://github.com/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n')
          command = ['gh','issue','edit',str(issue['number'])] if issue else ['gh','issue','create','--title',title]
          subprocess.run(command+['--repo',repo,'--body-file',str(body)], check=True)
          PY
