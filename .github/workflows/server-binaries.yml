name: server-binaries
# Compiles this fork together with the mod-coa-playerbots module and checks the result starts.
# The release pipeline (coa-server-build) builds the same way from exact commit SHAs.
on:
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: coa-bots
      bots_ref:
        type: string
        default: master
      scaling_ref:
        type: string
        default: main
      squid_ref:
        type: string
        default: latest-release
    outputs:
      squid_tag:
        value: ${{ jobs.build.outputs.squid_tag }}
      squid_sha:
        value: ${{ jobs.build.outputs.squid_sha }}
      core_sha:
        value: ${{ jobs.build.outputs.core_sha }}
      bots_sha:
        value: ${{ jobs.build.outputs.bots_sha }}
      scaling_sha:
        value: ${{ jobs.build.outputs.scaling_sha }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Corfirean/azerothcore-wotlk-coa
          ref: ${{ inputs.core_ref || 'coa-bots' }}
          fetch-depth: 0
      - name: Verify source and harness infrastructure on POSIX
        run: python3 -B tools/verify_all.py --stages source --base origin/coa-bots
      - name: Upload source verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-verification-diagnostics
          path: .cache/verify-all/
  build:
    needs: source
    runs-on: ${{ fromJSON(vars.COA_WINDOWS_RUNNER || '["windows-latest"]') }}
    permissions:
      actions: read
      contents: read
    timeout-minutes: 330
    outputs:
      squid_tag: ${{ steps.squid.outputs.squid_tag }}
      squid_sha: ${{ steps.shas.outputs.squid_sha }}
      core_sha: ${{ steps.shas.outputs.core_sha }}
      bots_sha: ${{ steps.shas.outputs.bots_sha }}
      scaling_sha: ${{ steps.shas.outputs.scaling_sha }}
    env:
      VSLANG: 1033
      BOOST_ROOT: C:\local\boost_1_87_0
      SCCACHE_CACHE_SIZE: 8G
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Corfirean/azerothcore-wotlk-coa
          ref: ${{ inputs.core_ref || 'coa-bots' }}
          fetch-depth: 0
      # Cache the fetched Boost + MySQL client so we don't re-download ~350 MB
      # and re-run the Boost installer on every run. The Test-Path guards in
      # "Configure OS" short-circuit the install work when these are restored.
      - name: Cache Boost & MySQL
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9
      - name: Configure OS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The windows-latest runner image already ships CMake, Visual Studio
          # (with the native desktop workload + MSVC) and OpenSSL, so we only need to
          # provide Boost and the MySQL client libraries. We fetch these directly
          # instead of via chocolatey, whose pinned packages keep breaking on CI
          # (VS detection failures and slproweb removing old OpenSSL installers).

          # --- Boost 1.87.0 (msvc-14.3, 64-bit) prebuilt binaries -> C:\local\boost_1_87_0 (BOOST_ROOT) ---
          # Go through downloads.sourceforge.net, which hands out an https mirror. The
          # master.dl host redirects to a plain-http URL that PowerShell 7.4+ refuses to
          # follow, and an installer we then execute shouldn't travel in the clear anyway.
          # SourceForge sniffs the user agent: anything starting with Mozilla gets the HTML
          # download page instead of the file, so send a non-browser one. Note this is the
          # opposite of what the MySQL archives CDN below wants.
          if (-not (Test-Path 'C:\local\boost_1_87_0\boost'))
          {
              $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
              $boostUrl = 'https://downloads.sourceforge.net/project/boost/boost-binaries/' +
                  '1.87.0/boost_1_87_0-msvc-14.3-64.exe'
              # Mirrors drop connections often enough on a 200 MB file to be worth retrying.
              # OperationTimeoutSeconds is the one that catches a mirror going quiet mid-transfer,
              # which would otherwise hang the job until the 6h runner limit. Don't collapse the
              # two into a whole-transfer budget, slow mirrors can need 15+ minutes.
              $boostRequest = @{
                  Uri                      = $boostUrl
                  OutFile                  = $boostExe
                  UserAgent                = 'azerothcore-ci'
                  ConnectionTimeoutSeconds = 60
                  OperationTimeoutSeconds  = 60
              }
              $boostAttempts = 3
              for ($attempt = 1; $attempt -le $boostAttempts; $attempt++)
              {
                  try
                  {
                      Invoke-WebRequest @boostRequest
                      # A mirror can answer 200 with an error page, which doesn't throw. Size-check
                      # inside the loop so a bad payload retries onto a different mirror instead of
                      # failing the job outright. Each attempt re-rolls the mirror.
                      $boostMB = (Get-Item $boostExe).Length / 1MB
                      if ($boostMB -lt 50) { throw "got $([int]$boostMB) MB, likely an HTML page." }
                      break
                  }
                  catch
                  {
                      Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
                      if ($attempt -eq $boostAttempts) { throw }
                      Start-Sleep -Seconds 15
                  }
              }
              Write-Host ("Downloaded Boost installer: {0:N1} MB" -f $boostMB)
              $boostProc = Start-Process -FilePath $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -WindowStyle Hidden -Wait -PassThru
              if ($boostProc.ExitCode -ne 0) { throw "Boost installer failed with exit code $($boostProc.ExitCode)." }
              # Fail fast if the installer "succeeded" but didn't lay down the expected tree,
              # instead of surfacing a cryptic error later during CMake configuration.
              if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) { throw 'Boost install missing headers at C:\local\boost_1_87_0\boost.' }
              if (-not (Test-Path 'C:\local\boost_1_87_0\lib64-msvc-14.3')) { throw 'Boost install missing prebuilt libs at C:\local\boost_1_87_0\lib64-msvc-14.3.' }
          }

          # --- MySQL 8.4 client headers + libs -> C:\tools\mysql\current (path the build expects) ---
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib'))
          {
              # Use the archives CDN directly (keeps every version, unlike dev.mysql.com/get which only
              # serves the current GA). A browser user-agent is required or Oracle returns an HTML error page.
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
              Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $mysqlZip -UserAgent 'Mozilla/5.0'
              $mysqlMB = (Get-Item $mysqlZip).Length / 1MB
              Write-Host ("Downloaded MySQL zip: {0:N1} MB" -f $mysqlMB)
              if ($mysqlMB -lt 50) { throw "MySQL zip download looks wrong ($([int]$mysqlMB) MB)." }
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
              # Fail fast if the archive layout changed and the client import library isn't
              # where the build expects it, rather than failing later during CMake/link.
              if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) { throw 'MySQL client import library missing at C:\tools\mysql\current\lib\mysqlclient.lib.' }
          }

          # --- OpenSSL: use the copy already installed on the runner image ---
          $opensslRoot = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64', 'C:\vcpkg\installed\x64-windows-static-md') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
              Select-Object -First 1
          if (-not $opensslRoot)
          {
              throw 'No OpenSSL development install found on the runner image.'
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using OpenSSL at $opensslRoot"
      - name: Fetch mod-coa-playerbots
        uses: actions/checkout@v7
        with:
          repository: Corfirean/mod-coa-playerbots
          ref: ${{ inputs.bots_ref || 'master' }}
          path: _bots
      - name: Fetch mod-coa-content-scaling
        uses: actions/checkout@v7
        with:
          repository: Corfirean/mod-coa-content-scaling
          ref: ${{ inputs.scaling_ref || 'main' }}
          path: _scaling
      - name: Release integration tools
        uses: actions/checkout@v7
        with:
          path: _pipeline
      - name: Resolve the SQUID release tag to an exact commit
        id: squid
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SQUID_REF: ${{ inputs.squid_ref || 'latest-release' }}
        run: ./_pipeline/scripts/resolve-squid.ps1 -Ref $env:SQUID_REF
      - name: Fetch unchanged SQUID Playerbots
        uses: actions/checkout@v7
        with:
          repository: Zyth45/mod-playerbots
          ref: ${{ steps.squid.outputs.squid_sha }}
          path: modules/mod-playerbots
      - name: Place the modules where the core expects them
        id: shas
        shell: pwsh
        run: |
          "squid_sha=$(git -C modules/mod-playerbots rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "core_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bots_sha=$(git -C _bots rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "scaling_sha=$(git -C _scaling rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $dst = 'modules/mod-coa-playerbots'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force '_bots/module/src' "$dst/src"
          New-Item -ItemType Directory -Force -Path "$dst/conf" | Out-Null
          Copy-Item -Force '_bots/module/conf/*' "$dst/conf/"
          # Content Scaling is a module repository of its own; its TBC and WotLK content packs are modules of their own too
          # (they sit in content-packs/ and must stand next to it in modules/).
          robocopy '_scaling' 'modules\mod-coa-content-scaling' /E /XD .git artifacts tools /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "copying mod-coa-content-scaling failed ($LASTEXITCODE)" }
          foreach ($pack in 'mod-coa-tbc-content', 'mod-coa-wotlk-content') {
            robocopy "_scaling\content-packs\$pack" "modules\$pack" /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "copying $pack failed ($LASTEXITCODE)" }
          }
          $global:LASTEXITCODE = 0
          "bots commit: $(git -C _bots rev-parse HEAD)"
          "scaling commit: $(git -C _scaling rev-parse HEAD)"
          "core commit: $(git rev-parse HEAD)"
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Locate CMake and Ninja on the dedicated runner
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -prerelease -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ tools were not found.' }
          foreach ($relative in 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin', 'Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja') {
            $directory = Join-Path $installation $relative
            if (-not (Test-Path -LiteralPath $directory)) { throw "Missing build tools: $directory" }
            $directory >> $env:GITHUB_PATH
          }
      - name: Select persistent build directory and restore unchanged input timestamps
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe).Source
          $binaries = 'cl.exe', 'c1xx.dll', 'c2.dll', 'link.exe'
          $hashes = $binaries | ForEach-Object { (Get-FileHash (Join-Path (Split-Path $compiler) $_) -Algorithm SHA256).Hash }
          $identity = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($hashes -join '-')))).Substring(0, 16).ToLowerInvariant()
          $state = Join-Path $env:RUNNER_WORKSPACE "_coa-build-state/$identity-noPCH-Z7-deps-v3"
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          "COA_BUILD_DIRECTORY=$state/build" >> $env:GITHUB_ENV
          $mode = if (Test-Path (Join-Path $state 'verified.json')) { 'incremental' } else { 'cold' }
          "COA_BUILD_MODE=$mode" >> $env:GITHUB_ENV
          python _pipeline/scripts/persistent-build.py --root . --state "$state/inputs.json"
          if ($LASTEXITCODE) { throw 'Persistent source identity validation failed.' }
      - name: Set compiler cache directory before starting sccache
        shell: pwsh
        run: '"SCCACHE_DIR=$env:RUNNER_TEMP/sccache" | Out-File $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Install pinned sccache
        id: sccache
        if: runner.environment != 'self-hosted'
        continue-on-error: true
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: v0.10.0
      - name: Identify compiler cache compatibility
        id: toolchain
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe).Source
          $identity = (Get-Item $compiler).VersionInfo.FileVersion + '-RelWithDebInfo-Z7-noPCH-sccache0100'
          "identity=$identity" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore compiler cache
        id: compiler-cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/sccache
          key: trusted-msvc-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-boost187-mysql849-${{ hashFiles('_pipeline/.github/workflows/server-binaries.yml') }}-${{ steps.shas.outputs.core_sha }}-${{ steps.shas.outputs.bots_sha }}-${{ steps.shas.outputs.scaling_sha }}-${{ steps.shas.outputs.squid_sha }}
          restore-keys: |
            trusted-msvc-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-boost187-mysql849-${{ hashFiles('_pipeline/.github/workflows/server-binaries.yml') }}-${{ steps.shas.outputs.core_sha }}-${{ steps.shas.outputs.bots_sha }}-${{ steps.shas.outputs.scaling_sha }}-${{ steps.shas.outputs.squid_sha }}-
            trusted-msvc-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-boost187-mysql849-${{ hashFiles('_pipeline/.github/workflows/server-binaries.yml') }}-
            trusted-msvc-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-boost187-mysql849-
      - name: Configure
        env:
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
        shell: pwsh
        run: |
          "SCCACHE_DIR=$env:RUNNER_TEMP/sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:SCCACHE_DIR = "$env:RUNNER_TEMP/sccache"
          $launcher = if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted' -and (Get-Command sccache.exe -ErrorAction SilentlyContinue)) { 'sccache' } else { '' }
          $build = if ($env:COA_BUILD_DIRECTORY) { $env:COA_BUILD_DIRECTORY } else { 'build' }
          if (-not $launcher) { Write-Host 'Using MSVC directly; persistent Ninja outputs provide incremental builds on the dedicated runner.' }
          $opensslArgs = @()
          if ($env:RUNNER_ENVIRONMENT -eq 'self-hosted' -and $env:OPENSSL_ROOT_DIR -like '*vcpkg*') { $opensslArgs += '-DOPENSSL_USE_STATIC_LIBS=ON' }
          cmake -S . -B "$build" -G Ninja @opensslArgs `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DBUILD_TESTING=ON `
            -DCMAKE_JOB_POOLS=link_pool=1 `
            -DCMAKE_JOB_POOL_LINK=link_pool `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DCMAKE_C_COMPILER_LAUNCHER="$launcher" `
            -DCMAKE_CXX_COMPILER_LAUNCHER="$launcher" `
            -DAPPS_BUILD=all -DTOOLS_BUILD=none `
            -DSCRIPTS=static -DMODULES=static `
            -DUSE_COREPCH=0 -DUSE_SCRIPTPCH=0 `
            -DBOOST_ROOT=$env:BOOST_ROOT `
            -DMYSQL_INCLUDE_DIR=C:/tools/mysql/current/include `
            -DMYSQL_LIBRARY=C:/tools/mysql/current/lib/mysqlclient.lib `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"
      - name: Validate Ninja header dependency parsing for the installed MSVC language
        shell: pwsh
        run: |
          $build = if ($env:COA_BUILD_DIRECTORY) { $env:COA_BUILD_DIRECTORY } else { 'build' }
          python _pipeline/scripts/msvc-dependency-prefix.py --build "$build"
          if ($LASTEXITCODE) { throw 'Ninja cannot safely track MSVC header dependencies.' }
      - name: Verify generated MSVC commands can be cached
        shell: pwsh
        run: |
          $build = if ($env:COA_BUILD_DIRECTORY) { $env:COA_BUILD_DIRECTORY } else { 'build' }
          ninja -C "$build" -t commands | python _pipeline/scripts/validate-msvc-cache.py
          if ($LASTEXITCODE) { throw 'Generated compiler flags violate the cache configuration.' }
      - name: Reset compiler cache counters
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: sccache --zero-stats
      - name: Build worldserver and authserver
        timeout-minutes: 280
        env:
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
        shell: pwsh
        run: |
          $memoryGB = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          $jobs = [Math]::Min(4, [Environment]::ProcessorCount)
          if ($env:RUNNER_ENVIRONMENT -eq 'self-hosted') { $jobs = 0 }
          if ($memoryGB -lt 12) { $jobs = [Math]::Min(2, $jobs) }
          $effectiveJobs = if ($jobs) { $jobs } else { [Environment]::ProcessorCount }
          Write-Host "Compilation: $effectiveJobs workers, $([Environment]::ProcessorCount) logical CPUs, $([Math]::Round($memoryGB, 1)) GB RAM."
          $watch = [Diagnostics.Stopwatch]::StartNew()
          try {
            & ./_pipeline/scripts/run-core-verification.ps1 -CoreRoot . -BaseRef origin/coa-bots -Jobs $jobs -MaximumSeconds 16200 -BuildDirectory $env:COA_BUILD_DIRECTORY -Stages 'build,unit'
            if ($LASTEXITCODE) {
              $report = Get-ChildItem .cache/verify-all -Recurse -Filter build.log | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($report) { Get-Content $report.FullName -Tail 100 }
              throw 'Source, build or unit verification failed. See windows-verification-diagnostics for the complete logs.'
            }
            if ($env:COA_BUILD_DIRECTORY) {
              @{ core = (git rev-parse HEAD); verifiedAt = [DateTime]::UtcNow.ToString('o') } | ConvertTo-Json |
                Set-Content (Join-Path (Split-Path $env:COA_BUILD_DIRECTORY) 'verified.json') -Encoding utf8
            }
          } finally {
            $watch.Stop()
            $mode = if ($env:COA_BUILD_MODE) { $env:COA_BUILD_MODE } else { 'cold' }
            @{ mode = $mode; seconds = $watch.Elapsed.TotalSeconds; workers = $effectiveJobs } | ConvertTo-Json |
              Set-Content .cache/compilation-timing.json -Encoding utf8
            "Compilation and unit verification ($mode): $([Math]::Round($watch.Elapsed.TotalMinutes, 1)) minutes, $effectiveJobs workers." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          sccache --show-stats
          sccache --show-stats --stats-format json | Set-Content cache-statistics.json -Encoding utf8NoBOM
          python _pipeline/scripts/cache-summary.py cache-statistics.json
      - name: Flush compiler cache before archiving
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: sccache --stop-server
      - name: Preserve reusable compiler objects even when qualification fails
        if: always() && steps.sccache.outcome == 'success' && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}${{ job.status != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}
      - name: Upload compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-compiler-cache-statistics
          path: cache-statistics.json
      - name: Upload source, compilation and unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-diagnostics
          path: |
            .cache/verify-all/
            .cache/compilation-timing.json
          include-hidden-files: true
          retention-days: 14
      - name: Smoke test (binaries start and report their revision)
        if: success()
        shell: pwsh
        run: |
          $build = if ($env:COA_BUILD_DIRECTORY) { $env:COA_BUILD_DIRECTORY } else { 'build' }
          $bin = (Get-ChildItem $build -Recurse -Filter worldserver.exe | Select-Object -First 1).DirectoryName
          Write-Host "binaries in $bin"
          Get-ChildItem $bin | Select-Object Name, Length | Format-Table -AutoSize
          & "$bin\worldserver.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "worldserver --version exited with $LASTEXITCODE" }
          "BIN_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: coa-server-binaries
          path: |
            ${{ env.BIN_DIR }}/worldserver.exe
            ${{ env.BIN_DIR }}/authserver.exe
            ${{ env.BIN_DIR }}/*.dll
          retention-days: 14
