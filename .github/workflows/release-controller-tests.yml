name: release-controller-tests
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/*release*.py'
      - 'scripts/*candidate*.py'
      - 'scripts/*health*.py'
      - 'scripts/*channel*.py'
      - 'scripts/*compatibility*.py'
      - 'scripts/*sources*.py'
      - 'scripts/*metadata*.py'
      - 'scripts/*lock*.py'
      - 'scripts/*cache*.py'
      - 'scripts/*navigation*.py'
      - 'navigation-source.json'
      - 'docker/Dockerfile.linux'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Controller and immutable publication tests
        run: |
          python3 -B -m unittest discover -s scripts -p "test_*.py"
