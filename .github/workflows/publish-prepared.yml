name: publish-prepared
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful prepare-only build explicitly approved for publication
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: signed-candidate-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: windows-qualified-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-candidate-tool
          path: tool
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the approved source run and publish its exact signed candidate
        shell: pwsh
        run: |
          python scripts/validate-prepared-run.py --run $env:CANDIDATE_RUN_ID --lock candidate/release-lock.json
          if ($LASTEXITCODE) { throw 'The prepared source run is not eligible for publication.' }
          python scripts/publish-candidate.py --dir candidate --repo $env:GITHUB_REPOSITORY --tool tool/coa-release.exe
          if ($LASTEXITCODE) { throw 'Candidate verification or publication failed.' }
