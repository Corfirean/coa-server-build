name: preview-release
# Publishes a plugin-host core + SDK pair (built by preview-build) as a GitHub pre-release for the
# Modules Preview manager. Manual only, and nothing is published unless publish_to_testers is ticked.
# Never touches the Stable channel (latest.json) or stable branches.

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core branch or commit'
        default: 'preview/dynamic-plugin-host'
        type: string
      publish_to_testers:
        description: 'Publish the pair as a pre-release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/preview-build.yml
    with:
      core_ref: ${{ inputs.core_ref }}

  publish:
    name: Publish core + SDK pre-release
    needs: build
    if: inputs.publish_to_testers == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-core
          path: dist/

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ needs.build.outputs.core_sha }}
          ABI: ${{ needs.build.outputs.abi_fingerprint }}
        run: |
          set -euo pipefail
          tag="preview-core-${CORE_SHA:0:10}"
          {
            echo "Plugin host core ${CORE_SHA} for the CoA Modules Preview manager."
            echo
            echo "ABI fingerprint: \`${ABI}\`"
            echo
            echo "Modules are compiled by the manager against the SDK inside the core (Core/plugin-sdk.zip); plugins of another fingerprint are refused by this worldserver.exe."
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Preview core ${CORE_SHA:0:10}" --notes-file notes.md dist/*
