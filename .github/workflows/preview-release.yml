name: preview-release
# Release preparation and publication workflow for CSM Modules Preview.
# Publishes to the dedicated preview distribution channel.
# NEVER touches the Stable release pointer (latest.json) or stable branch.

on:
  workflow_dispatch:
    inputs:
      publish_to_testers:
        description: 'Publish candidate to Preview distribution channel'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_candidate:
    uses: ./.github/workflows/preview-build.yml
    with:
      core_ref: 'preview/dynamic-plugin-host'
      package_preview: true

  verify_candidate:
    needs: build_candidate
    uses: ./.github/workflows/preview-verify.yml
    with:
      bundle_artifact: 'preview-server-bundle'

  publish_preview:
    name: Publish Preview Channel Candidate
    needs: [build_candidate, verify_candidate]
    runs-on: windows-latest
    if: inputs.publish_to_testers == true
    steps:
      - uses: actions/checkout@v7

      - name: Download Packaged Preview Bundle
        uses: actions/download-artifact@v4
        with:
          name: preview-server-bundle
          path: dist/

      - name: Download Verification Report
        uses: actions/download-artifact@v4
        with:
          name: preview-verification-report
          path: verification/

      - name: Verify Bundle Integrity Before Publish
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/candidate-lock.json")) {
            throw "dist/candidate-lock.json missing from downloaded bundle!"
          }
          if (-not (Test-Path "dist/server/worldserver.exe")) {
            throw "dist/server/worldserver.exe missing from downloaded bundle!"
          }
          if (-not (Test-Path "dist/sha256sums.txt")) {
            throw "dist/sha256sums.txt missing from downloaded bundle!"
          }
          Write-Host "Candidate bundle verified successfully before publishing."

      - name: Publish to GitHub Releases (Preview Channel Only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = (Get-Content dist/candidate-lock.json -Raw | ConvertFrom-Json).version
          $tag = "preview-v$ver"
          gh release create "$tag" `
            --prerelease `
            --title "CSM Modules Preview $ver" `
            --notes-file "verification/PREVIEW_BUILDER_QUALIFICATION.md" `
            dist/*
