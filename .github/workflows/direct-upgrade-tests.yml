name: direct-upgrade-tests
on:
  workflow_dispatch:
    inputs:
      manager_ref:
        description: Manager revision to qualify
        default: master
      target_version:
        description: Signed server version (empty selects current stable)
        default: ''
      candidate_run_id:
        description: Successful prepare-only build run (empty uses a published target)
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  tool:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
      target_role: ${{ steps.freeze.outputs.target_role }}
    steps:
      - uses: actions/checkout@v7
      - name: Require a successful candidate preparation
        if: inputs.candidate_run_id != ''
        shell: pwsh
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          if ($env:CANDIDATE_RUN -notmatch '^\d+$') { throw 'Invalid candidate run' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/build.yml') { throw 'Candidate must come from successful build preparation' }
      - uses: actions/download-artifact@v4
        if: inputs.candidate_run_id != ''
        with:
          name: windows-qualified-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: _prepared
      - name: Freeze all source manifests and the Manager revision
        id: freeze
        env:
          MANAGER_REF: ${{ inputs.manager_ref }}
          TARGET_VERSION: ${{ inputs.target_version }}
        shell: pwsh
        run: |
          if (Test-Path _prepared) { python scripts/direct-upgrade-matrix.py --prepared _prepared }
          else { python scripts/direct-upgrade-matrix.py }
      - uses: actions/checkout@v7
        with:
          repository: Corfirean/coa-server-manager
          ref: ${{ steps.freeze.outputs.manager }}
          path: _manager
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _manager/target
          key: trusted-direct-tool-${{ runner.os }}-${{ hashFiles('_manager/Cargo.lock') }}
          restore-keys: trusted-direct-tool-${{ runner.os }}-
      - name: Build the release verifier and production updater once
        run: cargo build --release --locked -p coa-release --manifest-path _manager/Cargo.toml
      - name: Verify the exact signed prepared package
        if: inputs.candidate_run_id != ''
        shell: pwsh
        run: |
          & _manager/target/release/coa-release.exe verify --dir _prepared
          if ($LASTEXITCODE) { throw 'Prepared signature or package verification failed' }
          & _manager/target/release/coa-release.exe verify-install --dir _prepared
          if ($LASTEXITCODE) { throw 'Prepared installer verification failed' }
          python scripts/release-metadata.py --dir _prepared --verify
          if ($LASTEXITCODE) { throw 'Prepared metadata verification failed' }
      - uses: actions/upload-artifact@v4
        if: inputs.candidate_run_id != ''
        with:
          name: prepared-direct-candidate
          path: |
            _prepared/base.tar.zst.*
            _prepared/manifest.json
            _prepared/manifest.json.sig
            _prepared/release-lock.json
            _prepared/qualification.json
            _prepared/compatibility-matrix.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: direct-upgrade-tool
          path: |
            direct-upgrade-lock.json
            _manager/target/release/coa-release.exe
          retention-days: 7
  upgrade:
    needs: tool
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix: ${{ fromJSON(needs.tool.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: direct-upgrade-tool
      - uses: actions/download-artifact@v4
        if: inputs.candidate_run_id != ''
        with:
          name: prepared-direct-candidate
          path: _sources/${{ needs.tool.outputs.target_role }}
      - name: Verify and qualify the direct update
        shell: pwsh
        run: |
          $lock = Get-Content direct-upgrade-lock.json -Raw | ConvertFrom-Json
          $tool = '_manager/target/release/coa-release.exe'
          foreach ($role in @('base', $lock.targetRole, $env:SOURCE_ROLE) | Select-Object -Unique) {
            if (Test-Path "_sources/$role/qualification.json") { continue }
            python scripts/upgrade-sources.py --lock direct-upgrade-lock.json --download _sources --packages --role $role --tool $tool
            if ($LASTEXITCODE) { throw "Source verification failed: $role" }
          }
          New-Item -ItemType Directory -Force _reports | Out-Null
          & $tool qualify-upgrade --base _sources/base --source "_sources/$env:SOURCE_ROLE" --candidate "_sources/$($lock.targetRole)" --fixture "coa-schema-fixture-direct-$env:SOURCE_ROLE" --report "_reports/$env:SOURCE_ROLE.json"
          if ($LASTEXITCODE) { throw "Direct update failed: $env:SOURCE_ROLE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-upgrade-${{ matrix.role }}
          path: |
            _reports
            coa-schema-fixture-direct-*/Core/Logs
            coa-schema-fixture-direct-*.manager/diagnostics
            coa-schema-fixture-direct-*.manager/updates/*/txn.json
          retention-days: 7
  report:
    needs: [tool, upgrade]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: direct-upgrade-tool
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-upgrade-*
          merge-multiple: true
          path: _evidence
      - name: Require a passing report for every frozen source
        run: python scripts/direct-upgrade-matrix.py --reports _evidence/_reports
