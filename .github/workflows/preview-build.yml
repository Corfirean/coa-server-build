name: preview-build
# Dedicated CoA Modules Preview build and qualification pipeline.
# Compiles the modular AzerothCore host (preview/dynamic-plugin-host),
# exports the CoA Plugin SDK, builds official dynamic DLL plugins,
# packages the preview bundle, and runs fail-closed qualification.
# Stable release pipeline (main) is completely isolated and untouched.

on:
  push:
    branches:
      - 'preview/modules-v2'
    paths-ignore:
      - '**.md'
      - 'report/**'
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core branch/commit (defaults to preview/dynamic-plugin-host)'
        default: 'preview/dynamic-plugin-host'
        type: string
      package_preview:
        description: 'Whether to assemble the complete preview distribution bundle'
        default: true
        type: boolean
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: 'preview/dynamic-plugin-host'
      package_preview:
        type: boolean
        default: true
    outputs:
      core_sha:
        value: ${{ jobs.build_modular_host.outputs.core_sha }}
      abi_fingerprint:
        value: ${{ jobs.build_modular_host.outputs.abi_fingerprint }}
      bundle_artifact:
        value: ${{ jobs.package_preview_bundle.outputs.bundle_artifact }}

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_modular_host:
    name: Build Modular Host & SDK
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      core_sha: ${{ steps.core_meta.outputs.sha }}
      abi_fingerprint: ${{ steps.sdk_meta.outputs.fingerprint }}
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
    steps:
      - uses: actions/checkout@v7
        with:
          path: builder

      - uses: actions/checkout@v7
        with:
          repository: Corfirean/azerothcore-wotlk-coa
          ref: ${{ inputs.core_ref || 'preview/dynamic-plugin-host' }}
          path: core
          fetch-depth: 1

      - name: Cache Boost & MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9

      - name: Bootstrap Boost & MySQL on Cache Miss
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # --- Boost 1.87.0 (msvc-14.3, 64-bit) ---
          if (-not (Test-Path 'C:\local\boost_1_87_0\boost')) {
              $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
              $boostUrl = 'https://downloads.sourceforge.net/project/boost/boost-binaries/1.87.0/boost_1_87_0-msvc-14.3-64.exe'
              $boostRequest = @{
                  Uri                      = $boostUrl
                  OutFile                  = $boostExe
                  UserAgent                = 'azerothcore-ci'
                  ConnectionTimeoutSeconds = 60
                  OperationTimeoutSeconds  = 60
              }
              $boostAttempts = 3
              for ($attempt = 1; $attempt -le $boostAttempts; $attempt++) {
                  try {
                      Invoke-WebRequest @boostRequest
                      $boostMB = (Get-Item $boostExe).Length / 1MB
                      if ($boostMB -lt 50) { throw "got $([int]$boostMB) MB, likely an HTML page." }
                      break
                  } catch {
                      Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
                      if ($attempt -eq $boostAttempts) { throw }
                      Start-Sleep -Seconds 15
                  }
              }
              Write-Host ("Downloaded Boost installer: {0:N1} MB" -f $boostMB)
              $boostProc = Start-Process -FilePath $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -WindowStyle Hidden -Wait -PassThru
              if ($boostProc.ExitCode -ne 0) { throw "Boost installer failed with exit code $($boostProc.ExitCode)." }
              if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) { throw 'Boost install missing headers.' }
              if (-not (Test-Path 'C:\local\boost_1_87_0\lib64-msvc-14.3')) { throw 'Boost install missing prebuilt libs.' }
          }
          # --- MySQL 8.4 client ---
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) {
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
              Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $mysqlZip -UserAgent 'Mozilla/5.0'
              $mysqlMB = (Get-Item $mysqlZip).Length / 1MB
              Write-Host ("Downloaded MySQL zip: {0:N1} MB" -f $mysqlMB)
              if ($mysqlMB -lt 50) { throw "MySQL zip download looks wrong ($([int]$mysqlMB) MB)." }
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
              if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) { throw 'MySQL client import library missing.' }
          }
          # --- OpenSSL ---
          $opensslRoot = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
              Select-Object -First 1
          if ($opensslRoot) {
              "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "Using OpenSSL at $opensslRoot"
          }
          Write-Host "Dependencies successfully bootstrapped and verified."

      - name: Record Core Metadata
        id: core_meta
        shell: pwsh
        run: |
          cd core
          $sha = (git rev-parse HEAD).Trim()
          Write-Output "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Modular Core HEAD: $sha"

      - name: Build Modular Host & Generate SDK
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File builder/scripts/preview-build.ps1 `
            -CoreDir "$PWD/core" `
            -OutputDir "$PWD/artifacts/server" `
            -SdkOutputDir "$PWD/artifacts/sdk"

      - name: Extract SDK Fingerprint
        id: sdk_meta
        shell: pwsh
        run: |
          $sdkJson = Get-Content "artifacts/sdk/sdk.json" -Raw | ConvertFrom-Json
          $fp = $sdkJson.abiFingerprint
          Write-Output "fingerprint=$fp" >> $env:GITHUB_OUTPUT
          Write-Host "Preview SDK ABI Fingerprint: $fp"

      - name: Upload Host & SDK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-host-and-sdk
          path: artifacts/
          retention-days: 7

  build_official_plugins:
    name: Build Official DLL Plugins
    needs: build_modular_host
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: builder

      - name: Download Host & SDK
        uses: actions/download-artifact@v4
        with:
          name: preview-host-and-sdk
          path: artifacts/

      - name: Build Dynamic Plugins
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File builder/scripts/preview-build-plugins.ps1 `
            -SdkDir "$PWD/artifacts/sdk" `
            -OutputDir "$PWD/artifacts/plugins"

      - name: Upload Dynamic Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-official-plugins
          path: artifacts/plugins/
          retention-days: 7

  package_preview_bundle:
    name: Package Preview Distribution
    needs: [build_modular_host, build_official_plugins]
    runs-on: windows-latest
    outputs:
      bundle_artifact: preview-server-bundle
    steps:
      - uses: actions/checkout@v7
        with:
          path: builder

      - name: Download Host & SDK
        uses: actions/download-artifact@v4
        with:
          name: preview-host-and-sdk
          path: artifacts/

      - name: Download Plugins
        uses: actions/download-artifact@v4
        with:
          name: preview-official-plugins
          path: artifacts/plugins/

      - name: Generate Runner Candidate Lock
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File builder/scripts/generate-candidate-lock.ps1 `
            -SourceLock "builder/source-lock.json" `
            -ServerDir "$PWD/artifacts/server" `
            -SdkDir "$PWD/artifacts/sdk" `
            -PluginsDir "$PWD/artifacts/plugins" `
            -OutputFile "builder/candidate-lock.json"

      - name: Assemble Preview Server Package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File builder/scripts/preview-package.ps1 `
            -ServerDir "$PWD/artifacts/server" `
            -SdkDir "$PWD/artifacts/sdk" `
            -PluginsDir "$PWD/artifacts/plugins" `
            -CandidateLock "builder/candidate-lock.json" `
            -OutputDir "$PWD/dist" `
            -ChannelDir "$PWD/updates"

      - name: Upload Preview Server Bundle
        uses: actions/upload-artifact@v4
        with:
          name: preview-server-bundle
          path: dist/
          retention-days: 14

      - name: Upload Channel Metadata
        uses: actions/upload-artifact@v4
        with:
          name: preview-channel-metadata
          path: updates/
          retention-days: 14

  verify_packaged_bundle:
    name: Verify Preview Qualification Matrix (Fail-Closed)
    needs: package_preview_bundle
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: builder

      - name: Download Packaged Preview Bundle
        uses: actions/download-artifact@v4
        with:
          name: preview-server-bundle
          path: bundle/

      - name: Run Qualification Script (Fail-Closed)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File builder/scripts/preview-verify.ps1 `
            -BundleDir "$PWD/bundle" `
            -ReportOut "PREVIEW_BUILDER_QUALIFICATION.md" `
            -VerdictOut "preview-qualification-verdict.json"

      - name: Upload Verification Report and Verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-verification-report
          path: |
            PREVIEW_BUILDER_QUALIFICATION.md
            preview-qualification-verdict.json
