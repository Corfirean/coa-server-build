name: preview-build
# Builds the CoA plugin host core for the Modules Preview manager: worldserver.exe + authserver.exe and the
# CoA Plugin SDK from the same build, checked to carry the same ABI fingerprint. Modules are compiled on the
# users' PCs by the manager against this SDK, so no plugins are built here.
# The toolchain is pinned by the core (tools/plugin-sdk/toolchain.json): users install the same MSVC.
# Stable release pipeline (main) is isolated and untouched.

on:
  push:
    branches:
      - 'preview/modules-v2'
    paths:
      - '.github/workflows/preview-build.yml'
      - 'scripts/preview-build.ps1'
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core branch or commit'
        default: 'preview/dynamic-plugin-host'
        type: string
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: 'preview/dynamic-plugin-host'
    outputs:
      core_sha:
        value: ${{ jobs.host.outputs.core_sha }}
      abi_fingerprint:
        value: ${{ jobs.host.outputs.abi_fingerprint }}

concurrency:
  group: preview-build-${{ inputs.core_ref || 'preview/dynamic-plugin-host' }}
  cancel-in-progress: false

jobs:
  host:
    name: Plugin host + SDK
    runs-on: windows-2025
    timeout-minutes: 300
    outputs:
      core_sha: ${{ steps.meta.outputs.core_sha }}
      abi_fingerprint: ${{ steps.meta.outputs.abi_fingerprint }}
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
    steps:
      - uses: actions/checkout@v7
        with:
          path: builder

      - uses: actions/checkout@v7
        with:
          repository: Corfirean/azerothcore-wotlk-coa
          ref: ${{ inputs.core_ref || 'preview/dynamic-plugin-host' }}
          path: core
          fetch-depth: 1

      - name: Toolchain pin
        id: pin
        shell: pwsh
        run: |
          $pin = Get-Content core/tools/plugin-sdk/toolchain.json -Raw | ConvertFrom-Json
          "toolset=$($pin.msvcToolset)" >> $env:GITHUB_OUTPUT
          "cl=$($pin.clVersion)" >> $env:GITHUB_OUTPUT
          if (-not $pin.clVersion) { Write-Host "::warning::toolchain.json has no clVersion yet; the compiler version is recorded but not enforced." }

      - name: Cache Boost & MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9

      - name: Boost, MySQL client, OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'C:\local\boost_1_87_0\boost')) {
              $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
              $req = @{ Uri = 'https://downloads.sourceforge.net/project/boost/boost-binaries/1.87.0/boost_1_87_0-msvc-14.3-64.exe'
                        OutFile = $boostExe; UserAgent = 'azerothcore-ci'; ConnectionTimeoutSeconds = 60; OperationTimeoutSeconds = 60 }
              for ($i = 1; $i -le 3; $i++) {
                  try { Invoke-WebRequest @req; if ((Get-Item $boostExe).Length -lt 50MB) { throw 'got an HTML page' }; break }
                  catch { Write-Host "Boost download attempt $i failed: $($_.Exception.Message)"; if ($i -eq 3) { throw }; Start-Sleep 15 }
              }
              $p = Start-Process $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -WindowStyle Hidden -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "Boost installer exit code $($p.ExitCode)" }
              if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) { throw 'Boost headers missing' }
          }
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) {
              $zip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
              Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $zip -UserAgent 'Mozilla/5.0'
              if ((Get-Item $zip).Length -lt 50MB) { throw 'MySQL zip download looks wrong' }
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $zip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
              if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) { throw 'mysqlclient.lib missing' }
          }
          $ssl = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } | Select-Object -First 1
          if (-not $ssl) { throw 'No OpenSSL development install on the runner image.' }
          "OPENSSL_ROOT_DIR=$ssl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSVC environment (pinned toolset)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.pin.outputs.toolset }}

      - name: Compiler
        shell: pwsh
        run: |
          cl 2>&1 | Select-Object -First 1
          Write-Host "VCToolsVersion=$env:VCToolsVersion"

      - name: Build host, export SDK, verify the pair
        shell: pwsh
        run: |
          ./builder/scripts/preview-build.ps1 -CoreDir core -BuildDir "$env:RUNNER_TEMP\b" -OutDir out `
            -Jobs 4 -ExpectCl '${{ steps.pin.outputs.cl }}'

      - name: Metadata
        id: meta
        shell: pwsh
        run: |
          $pair = Get-Content out/pair.json -Raw | ConvertFrom-Json
          "core_sha=$($pair.coreCommit)" >> $env:GITHUB_OUTPUT
          "abi_fingerprint=$($pair.abiFingerprint)" >> $env:GITHUB_OUTPUT
          Write-Host "core $($pair.coreCommit)  ABI $($pair.abiFingerprint)  $($pair.compiler)"
          $short = $pair.abiFingerprint.Substring(0, 16)
          # The SDK travels inside the core as Core/plugin-sdk.zip, so a core update or rollback always
          # carries its own SDK; the manager unpacks it when it first builds a module.
          Compress-Archive -Path out/sdk/* -DestinationPath out/core/plugin-sdk.zip
          Compress-Archive -Path out/core/* -DestinationPath "out/coa-core-$short.zip"
          Get-ChildItem out/*.zip | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload core + SDK pair
        uses: actions/upload-artifact@v4
        with:
          name: preview-core
          path: |
            out/*.zip
            out/pair.json
          retention-days: 14
